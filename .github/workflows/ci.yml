name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libeigen3-dev \
            libmodbus-dev \
            libopencv-dev \
            libserialport-dev \
            pkg-config \
            python3-dev \
            python3-numpy

      - name: Configure
        run: cmake .

      - name: Build
        run: make -j"$(nproc)"
